server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mcp-catalog-server
  ai:
    mcp:
      server:
        # Slice 4: synchronous Streamable HTTP MCP server. Local-only by default.
        enabled: true
        name: mcp-catalog-server
        version: 0.1.0
        protocol: STREAMABLE
        type: SYNC
        # STDIO, resources, prompts and completions are Phase 3 concerns.
        stdio: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        # Tools are registered through Spring AI ToolCallback beans (see
        # McpServerConfiguration). The @McpTool annotation scanner is unused here and
        # logs a misleading empty-registry warning when enabled.
        annotation-scanner:
          enabled: false
        streamable-http:
          mcp-endpoint: /mcp
    retry:
      # D5: no automatic model retry in Slice 14. Spring AI's default retries transient
      # provider failures up to 10 times, which would mask an unreachable provider as a
      # timeout; zero keeps one attempt so unavailability surfaces as a sanitized 503.
      max-attempts: 0
    ollama:
      # D6/D7: local Ollama only. No contact is made during startup because the
      # model pull strategy is 'never', so REST/MCP/catalog work with Ollama absent.
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      init:
        pull-model-strategy: never
      chat:
        # Canonical Spring AI property (`chat.options.model` is the deprecated alias).
        model: ${OLLAMA_MODEL:qwen3-coder-next:latest}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    create-schemas: false
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false
    clean-disabled: true
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

catalog:
  ai:
    # D5/D7: bounded catalog assistant. Endpoint: POST /api/v1/catalog/assistant.
    # Only provider "ollama" is implemented in Slice 14; any other value makes the
    # assistant unavailable (503) without affecting REST, MCP or catalog behavior.
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:ollama}
    # Bounded provider timeout; a timeout returns a sanitized 504.
    timeout: ${AI_TIMEOUT:60s}

mcp:
  server:
    security:
      # Request-origin protection for the local HTTP MCP transport.
      # The "*" suffix is the SDK's port wildcard; only loopback hosts are allowed.
      # A present Origin header must match this list. An absent Origin header
      # (non-browser MCP clients) is allowed. Set to an empty list to reject every
      # request that sends an Origin header. Override with
      # MCP_SERVER_SECURITY_ALLOWED_ORIGINS (comma-separated).
      allowed-origins:
        - http://127.0.0.1:*
        - http://localhost:*
      # DNS-rebinding protection. A present Host header must match this list; an
      # empty list disables Host validation. Override with
      # MCP_SERVER_SECURITY_ALLOWED_HOSTS (comma-separated).
      allowed-hosts:
        - 127.0.0.1:*
        - localhost:*
