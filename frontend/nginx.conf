server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://mcp-catalog-server:8080;
    }

    # MCP is available only through the existing backend endpoint.
    location = /mcp { return 404; }
    location ^~ /mcp/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
